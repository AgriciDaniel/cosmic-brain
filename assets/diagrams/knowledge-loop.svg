<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 610" role="img" aria-labelledby="title description">
  <title id="title">The claude-obsidian knowledge loop</title>
  <desc id="description">A four-stage loop moves sources through capture, grounding, connection, and use while preserving evidence.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f6eadd"/>
      <stop offset=".58" stop-color="#fbf4ec"/>
      <stop offset="1" stop-color="#fff9f2"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#e9823c"/>
      <stop offset="1" stop-color="#6630b8"/>
    </linearGradient>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto">
      <path d="M0 0 9 4.5 0 9Z" fill="#6630b8"/>
    </marker>
    <filter id="cardShadow" x="-12%" y="-18%" width="124%" height="146%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#4d372b" flood-opacity=".1"/>
    </filter>
  </defs>
  <style>
    text { font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    .card { animation: rise .9s cubic-bezier(.2,.75,.25,1) both; transform-box: fill-box; transform-origin: center; }
    .card-2 { animation-delay: .14s; }
    .card-3 { animation-delay: .28s; }
    .card-4 { animation-delay: .42s; }
    .flow { stroke-dasharray: 7 10; animation: travel 10s linear infinite; }
    .pulse { animation: pulse 4.2s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
    .constellation { animation: drift 9s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
    @keyframes rise { from { opacity: 0; transform: translateY(7px); } to { opacity: 1; transform: translateY(0); } }
    @keyframes travel { to { stroke-dashoffset: -68; } }
    @keyframes pulse { 0%, 100% { opacity: .6; transform: scale(.96); } 50% { opacity: 1; transform: scale(1.04); } }
    @keyframes drift { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-4px); } }
    @media (prefers-reduced-motion: reduce) { .card, .flow, .pulse, .constellation { animation: none; } }
  </style>

  <rect width="900" height="610" rx="24" fill="url(#background)"/>
  <g class="constellation" fill="none" stroke="#dfc8b4" stroke-width="1.2" opacity=".62">
    <path d="M731 44L772 25 819 54 856 29"/>
    <circle cx="731" cy="44" r="4" fill="#ee975a" stroke="none"/>
    <circle cx="772" cy="25" r="3.5" fill="#f5caa8" stroke="none"/>
    <circle cx="819" cy="54" r="4" fill="#d9a2f4" stroke="none"/>
    <circle cx="856" cy="29" r="3" fill="#883aee" stroke="none"/>
  </g>
  <text x="42" y="44" fill="#a94f1b" font-size="14" font-weight="750" letter-spacing="2.2">THE COMPOUNDING LOOP</text>
  <text x="42" y="82" fill="#403b48" font-size="29" font-weight="720">From source material to usable knowledge</text>
  <text x="42" y="112" fill="#6f6873" font-size="17">Four clear stages. One traceable path back to the evidence.</text>

  <path d="M432 236H468" fill="none" stroke="#6630b8" stroke-width="2.3" marker-end="url(#arrow)" class="flow"/>
  <path d="M663 336V382" fill="none" stroke="#6630b8" stroke-width="2.3" marker-end="url(#arrow)" class="flow"/>
  <path d="M468 482H432" fill="none" stroke="#6630b8" stroke-width="2.3" marker-end="url(#arrow)" class="flow"/>
  <path d="M237 382V336" fill="none" stroke="#e9823c" stroke-width="2.3" marker-end="url(#arrow)" class="flow"/>

  <g class="card card-1">
    <rect x="42" y="136" width="390" height="200" rx="18" fill="#fff9f4" stroke="#dfc8b4" filter="url(#cardShadow)"/>
    <rect x="42" y="136" width="390" height="5" rx="2.5" fill="#e9823c"/>
    <circle cx="78" cy="178" r="20" fill="#e9823c" opacity=".16"/>
    <text x="78" y="184" fill="#a94f1b" font-size="15" font-weight="750" text-anchor="middle">01</text>
    <text x="110" y="185" fill="#403b48" font-size="21" font-weight="720">CAPTURE</text>
    <text x="68" y="225" fill="#403b48" font-size="19" font-weight="650">Bring sources in</text>
    <text x="68" y="258" fill="#6f6873" font-size="17">Visible inbox · local files</text>
    <text x="68" y="287" fill="#6f6873" font-size="17">Approved external runners</text>
    <rect x="260" y="292" width="146" height="30" rx="15" fill="#fff1e7" stroke="#e8c2a4"/>
    <circle cx="282" cy="307" r="4" fill="#e9823c"/>
    <text x="296" y="312" fill="#6b4939" font-size="13.5">explicit intake</text>
  </g>

  <g class="card card-2">
    <rect x="468" y="136" width="390" height="200" rx="18" fill="#fff9f4" stroke="#dfc8b4" filter="url(#cardShadow)"/>
    <rect x="468" y="136" width="390" height="5" rx="2.5" fill="#ee975a"/>
    <circle cx="504" cy="178" r="20" fill="#e9823c" opacity=".16"/>
    <text x="504" y="184" fill="#a94f1b" font-size="15" font-weight="750" text-anchor="middle">02</text>
    <text x="536" y="185" fill="#403b48" font-size="21" font-weight="720">GROUND</text>
    <text x="494" y="225" fill="#403b48" font-size="19" font-weight="650">Keep the evidence</text>
    <text x="494" y="258" fill="#6f6873" font-size="17">Immutable source copy</text>
    <text x="494" y="287" fill="#6f6873" font-size="17">Source + claim ledgers</text>
    <rect x="686" y="292" width="146" height="30" rx="15" fill="#fff1e7" stroke="#e8c2a4"/>
    <circle cx="708" cy="307" r="4" fill="#ee975a"/>
    <text x="722" y="312" fill="#6b4939" font-size="13.5">traceable claims</text>
  </g>

  <g class="card card-3">
    <rect x="468" y="382" width="390" height="200" rx="18" fill="#fcf9ff" stroke="#d4b7f2" filter="url(#cardShadow)"/>
    <rect x="468" y="382" width="390" height="5" rx="2.5" fill="#883aee"/>
    <circle cx="504" cy="424" r="20" fill="#6630b8" opacity=".2"/>
    <text x="504" y="430" fill="#6630b8" font-size="15" font-weight="750" text-anchor="middle">03</text>
    <text x="536" y="431" fill="#403b48" font-size="21" font-weight="720">CONNECT</text>
    <text x="494" y="471" fill="#403b48" font-size="19" font-weight="650">Build the wiki</text>
    <text x="494" y="504" fill="#6f6873" font-size="17">Linked pages · indexes · Canvas</text>
    <text x="494" y="533" fill="#6f6873" font-size="17">Methodology-aware structure</text>
    <rect x="678" y="538" width="154" height="30" rx="15" fill="#f3eaff" stroke="#d4b7f2"/>
    <circle cx="700" cy="553" r="4" fill="#883aee"/>
    <text x="714" y="558" fill="#5c2ead" font-size="13.5">connected context</text>
  </g>

  <g class="card card-4">
    <rect x="42" y="382" width="390" height="200" rx="18" fill="#fcf9ff" stroke="#d4b7f2" filter="url(#cardShadow)"/>
    <rect x="42" y="382" width="390" height="5" rx="2.5" fill="#6630b8"/>
    <circle cx="78" cy="424" r="20" fill="#6630b8" opacity=".2"/>
    <text x="78" y="430" fill="#6630b8" font-size="15" font-weight="750" text-anchor="middle">04</text>
    <text x="110" y="431" fill="#403b48" font-size="21" font-weight="720">USE</text>
    <text x="68" y="471" fill="#403b48" font-size="19" font-weight="650">Put knowledge to work</text>
    <text x="68" y="504" fill="#6f6873" font-size="17">Grounded answers · bounded research</text>
    <text x="68" y="533" fill="#6f6873" font-size="17">Lint · retrieve · fold</text>
    <rect x="252" y="538" width="154" height="30" rx="15" fill="#f3eaff" stroke="#d4b7f2"/>
    <circle cx="274" cy="553" r="4" fill="#6630b8"/>
    <text x="288" y="558" fill="#5c2ead" font-size="13.5">evidence-led output</text>
  </g>

  <rect x="280" y="343" width="340" height="32" rx="16" fill="#fff9f4" stroke="url(#accent)"/>
  <circle cx="306" cy="359" r="4.5" fill="#e9823c" class="pulse"/>
  <text x="321" y="365" fill="#534e59" font-size="14" font-weight="620">reviewed knowledge feeds the next use</text>
</svg>

<H4 style="MARGIN-LEFT: 56.7pt; TEXT-INDENT: -56.7pt"><A 
name=_Toc333576575>Archivieren von Word-Dokumenten</A></H4>
<P class=MsoNormal>&nbsp;</P>
<P class=MsoNormal>Um das Archivieren durchzuführen, muss man das gewünschte 
Microsoft Word-Dokument öffnen und auf den Punkt "WinLine Archiv" klicken.</P>
<P class=MsoNormal style="tab-stops: 61.5pt">Im Anschluss daran wird in WinLine 
in das Programm "Neuer Archiveintrag" geöffnet und dort kann beschlagwortet 
werden.</P>
